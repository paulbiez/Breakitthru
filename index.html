<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout Game</title>
<!-- Ajuste o caminho abaixo conforme a pasta do seu projeto -->
<link rel="stylesheet" href="style.css"> 
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <!-- Overlay HUD em jogo -->
    <div id="hudOverlay">
        <div class="hud-text">
            <span id="scoreText">Pts: 0</span> | 
            <span id="levelText">Fase: 1/20</span> | 
            <span id="livesText" style="color: #FF2A2A;">Vidas: 5</span>
        </div>
        <div class="sound-hud-btns">
            <button id="btnPause" class="hud-sound-btn" title="Pausar Jogo">⏸️</button>
            <button id="btnHudBgm" class="hud-sound-btn" title="Música de Fundo">🎵 <span id="hudBgmLabel">ON</span></button>
            <button id="btnHudSfx" class="hud-sound-btn" title="Efeitos Sonoros">🔊 <span id="hudSfxLabel">ON</span></button>
        </div>
    </div>

    <!-- Menu Principal -->
    <div id="menu" class="menu-overlay">
        <h1>BREAKOUT</h1>
        <button id="btnStart" class="menu-btn btn-start">Começar Jogo</button>
        <button id="selectLevelBtn" class="menu-btn">Selecionar Fase: 1</button>
        <button id="btnSettings" class="menu-btn btn-settings">Configurações</button>
    </div>

    <!-- Menu de Configurações Geral -->
    <div id="settingsMenu" class="menu-overlay" style="display: none;">
        <h2>Configurações</h2>
        <button id="btnSettingsSound" class="menu-btn btn-settings">Som</button>
        <button id="btnSettingsPaddle" class="menu-btn">Tamanho da Raquete</button>
        <button id="btnSettingsBallSpeed" class="menu-btn">Velocidade da Bola</button>
        <button id="btnSettingsBallSize" class="menu-btn">Tamanho da Bola</button>
        <button id="btnSettingsSave" class="menu-btn btn-start">Salvar e Voltar</button>
        <button id="btnSettingsCancel" class="menu-btn btn-danger">Cancelar</button>
    </div>

    <!-- Submenu de Som -->
    <div id="settingsSoundMenu" class="menu-overlay" style="display: none;">
        <h2>Configurações de Som</h2>
        
        <div class="sound-control-group">
            <label>Música de Fundo <span id="bgmValText">50%</span></label>
            <input type="range" id="bgmVolumeSlider" class="sound-slider" min="0" max="100" value="50">
        </div>

        <div class="sound-control-group">
            <label>Sons do Jogo (SFX) <span id="sfxValText">100%</span></label>
            <input type="range" id="sfxVolumeSlider" class="sound-slider" min="0" max="100" value="100">
        </div>

        <button id="btnSoundBack" class="menu-btn">Voltar</button>
    </div>

    <!-- Submenus de Configuração -->
    <div id="settingsPaddleMenu" class="menu-overlay" style="display: none;">
        <h2>Tamanho da Raquete</h2>
        <button class="menu-btn btn-paddle-size" data-size="small">Pequena</button>
        <button class="menu-btn btn-paddle-size" data-size="medium">Média</button>
        <button class="menu-btn btn-paddle-size" data-size="large">Grande</button>
        <div id="previewPaddle" style="height: 12px; background: #fff; border-radius: 6px; margin: 10px 0;"></div>
        <button id="btnPaddleBack" class="menu-btn">Voltar</button>
    </div>

    <div id="settingsBallSpeedMenu" class="menu-overlay" style="display: none;">
        <h2>Velocidade da Bola</h2>
        <button class="menu-btn btn-ball-speed" data-speed="slow">Lenta</button>
        <button class="menu-btn btn-ball-speed" data-speed="fast">Rápida</button>
        <button id="btnSpeedBack" class="menu-btn">Voltar</button>
    </div>

    <div id="settingsBallSizeMenu" class="menu-overlay" style="display: none;">
        <h2>Tamanho da Bola</h2>
        <button class="menu-btn btn-ball-size" data-size="small">Pequena</button>
        <button class="menu-btn btn-ball-size" data-size="normal">Normal</button>
        <button class="menu-btn btn-ball-size" data-size="large">Grande</button>
        <div id="previewBall" style="background: #fff; border-radius: 50%; margin: 10px 0;"></div>
        <button id="btnSizeBack" class="menu-btn">Voltar</button>
    </div>

    <!-- Menus In-Game -->
    <div id="pauseMenu" class="menu-overlay" style="display: none;">
        <h2>Jogo Pausado</h2>
        <button class="menu-btn btn-continue">Continuar</button>
        <button class="menu-btn btn-restart">Reiniciar Fase 1</button>
        <button class="menu-btn btn-quit btn-danger">Sair para o Menu</button>
    </div>

    <div id="gameOverMenu" class="menu-overlay" style="display: none;">
        <h2 id="gameOverTitle">FIM DO JOGO</h2>
        <p id="finalScore" style="color: #fff; font-size: 1.2rem; margin-bottom: 10px;"></p>
        <button class="menu-btn btn-continue">Continuar com 3 Vidas</button>
        <button class="menu-btn btn-quit btn-danger">Menu Principal</button>
    </div>

    <div id="winOverlay" class="menu-overlay" style="display: none;">
        <h2>PARABÉNS! VOCÊ VENCEU!</h2>
        <p id="winScore" style="color: #FFD700; font-size: 1.3rem; margin-bottom: 10px;"></p>
        <button class="menu-btn btn-quit">Menu Principal</button>
    </div>

    <!-- Modal Picker de Fase -->
    <div id="iosPickerOverlay">
        <div class="picker-card">
            <h2>Selecionar Fase</h2>
            <select id="pickerSelect" class="picker-select"></select>
            <button id="pickerConfirmBtn" class="menu-btn btn-start">Confirmar</button>
        </div>
    </div>
</div>

<script type="module" src="src/js/main.js"></script>
</body>
</html>

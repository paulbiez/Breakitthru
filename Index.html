<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Breakout Mobile - Giga Ball Ajustada & Nullificação</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: none; }
        #gameContainer { position: relative; width: 100%; max-width: 400px; height: 100%; max-height: 700px; border: 4px solid #555; box-shadow: inset 0 0 10px #000; box-sizing: border-box; }
        canvas { display: block; width: 100%; height: 100%; background: #050b30; }
        
        #menu, #gameOverMenu, #pauseMenu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 20; text-align: center; }
        
        button { padding: 12px 30px; margin: 6px; font-size: 1.1rem; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; min-width: 190px; text-align: center; }
        button.btn-continue { background: #00FF00; color: #000; }
        button.btn-restart { background: #f39c12; color: #fff; }
        button.btn-quit { background: #e74c3c; color: #fff; }
        button.btn-select { background: #3498db; color: #fff; }

        /* HUD com Botão de Quit */
        #hud { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; color: #fff; font-size: 13px; font-weight: bold; pointer-events: none; z-index: 5; }
        .high-score { color: #FFD700; }
        
        #quitBtn {
            pointer-events: auto;
            background: rgba(231, 76, 60, 0.85);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            width: 26px;
            height: 26px;
            min-width: unset;
            padding: 0;
            margin: 0;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        #quitBtn:active {
            background: #e74c3c;
            transform: scale(0.92);
        }

        /* Modal iOS Picker */
        #iosPickerOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: flex-end;
            flex-direction: column;
            z-index: 50;
        }
        .ios-picker-sheet {
            background: #ffffff;
            color: #000;
            width: 100%;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            overflow: hidden;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
            animation: slideUp 0.25s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .ios-picker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: #f8f8f8;
            border-bottom: 1px solid #ddd;
            font-size: 1.1rem;
        }
        .ios-picker-header span { font-weight: bold; color: #333; }
        .ios-btn-cancel { color: #e74c3c; cursor: pointer; font-weight: bold; border: none; background: none; font-size: 1.1rem; padding: 0; min-width: auto; }
        .ios-btn-select { color: #3498db; cursor: pointer; font-weight: bold; border: none; background: none; font-size: 1.1rem; padding: 0; min-width: auto; }

        .ios-wheel-container {
            position: relative;
            height: 250px;
            background: #fff;
            overflow: hidden;
            touch-action: pan-y;
        }
        .ios-wheel-highlight {
            position: absolute;
            top: 100px; 
            left: 0; right: 0;
            height: 50px;
            border-top: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
            background: rgba(0, 0, 0, 0.04);
            pointer-events: none;
        }
        .ios-wheel-list {
            position: absolute;
            width: 100%;
            top: 0; left: 0;
            list-style: none;
            padding: 0; margin: 0;
            transition: transform 0.2s cubic-bezier(0.1, 0.87, 0.35, 1);
        }
        .ios-wheel-item {
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 500;
            color: #aaa;
            user-select: none;
            cursor: pointer;
            transition: color 0.1s, font-size 0.1s, font-weight 0.1s;
        }
        .ios-wheel-item.selected {
            color: #000;
            font-weight: bold;
            font-size: 1.8rem;
        }
        
        #winOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.85); color: #FFD700; z-index: 30; text-align: center; padding: 20px; box-sizing: border-box;
        }
        .zoom-text {
            font-size: 1.8rem; font-weight: 900; text-shadow: 0 0 20px #FFD700;
            animation: zoomOutAnim 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes zoomOutAnim {
            0% { transform: scale(3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="hud">
        <span id="scoreText">Pts: 0</span>
        <span id="levelText">Fase: 1/20</span>
        <span id="highScoreText" class="high-score">Rec: 0</span>
        <span id="livesText">Vidas: 5</span>
        <button id="quitBtn" onclick="openPauseMenu()" title="Opções / Pausa">✕</button>
    </div>

    <!-- Menu Principal -->
    <div id="menu">
        <h1 style="margin-bottom: 5px;">BREAKOUT</h1>
        <p id="menuHighScore" class="high-score" style="margin-bottom: 15px; font-weight: bold;">RECORDE: 0</p>
        <button onclick="startGame('easy')">Fácil</button>
        <button onclick="startGame('medium')">Médio</button>
        <button onclick="startGame('hard')">Difícil</button>
        <button id="selectLevelBtn" class="btn-select" onclick="openIosPicker()">Fase: 1</button>
    </div>

    <!-- Menu de Pausa / Desistência Clássico -->
    <div id="pauseMenu" style="display: none;">
        <h2 style="margin-bottom: 20px; font-size: 1.8rem;">JOGO PAUSADO</h2>
        <button class="btn-continue" onclick="resumeGame()">Continuar</button>
        <button class="btn-restart" onclick="restartFromLevel1()">Reiniciar Jogo (Fase 1)</button>
        <button class="btn-quit" onclick="quitToMainMenu()">Menu Principal</button>
    </div>

    <!-- Modal iOS Picker Alinhado -->
    <div id="iosPickerOverlay">
        <div class="ios-picker-sheet">
            <div class="ios-picker-header">
                <button class="ios-btn-cancel" onclick="closeIosPicker()">Cancelar</button>
                <span>Selecionar Fase</span>
                <button class="ios-btn-select" onclick="confirmIosPicker()">Selecionar</button>
            </div>
            <div class="ios-wheel-container" id="wheelContainer">
                <div class="ios-wheel-highlight"></div>
                <ul class="ios-wheel-list" id="wheelList"></ul>
            </div>
        </div>
    </div>

    <div id="gameOverMenu" style="display: none;">
        <h1 id="gameOverTitle">FIM DE JOGO</h1>
        <p id="finalScore">Pontos Totais: 0</p>
        <p id="newRecordNotice" class="high-score" style="display: none; font-weight: bold;">NOVO RECORDE!</p>
        <button class="btn-continue" onclick="continueGame()">Continuar (Fase Atual)</button>
        <button onclick="quitToMainMenu()">Menu Principal</button>
    </div>

    <div id="winOverlay">
        <div class="zoom-text">SENSACIONAL!<br>VOCÊ VENCEU TODOS OS DESAFIOS!</div>
        <p id="winScore" style="color: white; margin-top: 30px; font-size: 1.2rem;">Pontos: 0</p>
        <button onclick="quitToMainMenu()" style="margin-top: 20px;">Menu Principal</button>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const menu = document.getElementById('menu');
    const pauseMenu = document.getElementById('pauseMenu');
    const gameOverMenu = document.getElementById('gameOverMenu');
    const winOverlay = document.getElementById('winOverlay');
    const scoreText = document.getElementById('scoreText');
    const levelText = document.getElementById('levelText');
    const highScoreText = document.getElementById('highScoreText');
    const menuHighScore = document.getElementById('menuHighScore');
    const livesText = document.getElementById('livesText');
    const newRecordNotice = document.getElementById('newRecordNotice');
    const selectLevelBtn = document.getElementById('selectLevelBtn');
    const iosPickerOverlay = document.getElementById('iosPickerOverlay');
    const wheelList = document.getElementById('wheelList');
    const wheelContainer = document.getElementById('wheelContainer');

    canvas.width = 400;
    canvas.height = 600;

    const topWallY = 40; 
    const INITIAL_LIVES = 5;
    const TOTAL_LEVELS = 20;

    let currentSelectedLevel = 1;
    let tempSelectedLevel = 1;

    let isCapsuleOnScreen = false;
    let warpDoorActive = false;
    let electricShieldActive = false;
    const shieldY = 580;

    let levelIntroActive = false;
    let levelIntroTimer = 0;
    let warpAnimationActive = false;
    let warpLaserTimer = 0;
    let gigaBallTimeout = null; // Temporizador para o Giga Ball

    const LEVEL_TEXT_COLORS = [
        '#FFD700', '#00FFFF', '#FF69B4', '#FFFF00', '#00BFFF',
        '#FFA500', '#00FF00', '#FFFFFF', '#FFD700', '#00FFFF',
        '#FFFF00', '#00FF00', '#FFA500', '#00FFFF', '#FFD700',
        '#FFFFFF', '#FF69B4', '#FFFF00', '#00FFFF', '#00FF00'
    ];

    const CAPSULE_WEIGHTS = [
        { type: 'C', weight: 15 },
        { type: 'E', weight: 15 },
        { type: 'S', weight: 15 },
        { type: 'H', weight: 15 },
        { type: 'G', weight: 15 },
        { type: 'D', weight: 15 },
        { type: 'P', weight: 5 },
        { type: 'B', weight: 5 }
    ];

    function getDeterministicCapsule() {
        let totalWeight = CAPSULE_WEIGHTS.reduce((acc, c) => acc + c.weight, 0);
        let seed = (Math.abs(score) % 10) + Math.floor(Math.abs(paddle.x));
        let value = seed % totalWeight;

        for (let c of CAPSULE_WEIGHTS) {
            if (value < c.weight) return c.type;
            value -= c.weight;
        }
        return 'C';
    }

    // iOS Picker
    const ITEM_HEIGHT = 50;
    const CENTER_OFFSET = 100;
    let wheelTranslateY = 0;
    let startY = 0;
    let draggingWheel = false;

    function buildIosWheel() {
        wheelList.innerHTML = '';
        let html = `<li style="height:${CENTER_OFFSET}px; pointer-events:none;"></li>`;
        for (let i = 1; i <= TOTAL_LEVELS; i++) {
            html += `<li class="ios-wheel-item" data-level="${i}">${i}</li>`;
        }
        html += `<li style="height:${CENTER_OFFSET}px; pointer-events:none;"></li>`;
        wheelList.innerHTML = html;

        wheelList.querySelectorAll('.ios-wheel-item').forEach(item => {
            item.addEventListener('click', (e) => {
                let lvl = parseInt(e.currentTarget.dataset.level);
                if (!isNaN(lvl)) scrollToLevel(lvl);
            });
        });

        forceSnapPosition();
    }
    buildIosWheel();

    function calculateLevelFromY(y) {
        let rawIndex = Math.round(1 - (y / ITEM_HEIGHT));
        return Math.max(1, Math.min(TOTAL_LEVELS, rawIndex));
    }

    function scrollToLevel(lvl) {
        tempSelectedLevel = Math.max(1, Math.min(TOTAL_LEVELS, lvl));
        wheelTranslateY = -(tempSelectedLevel - 1) * ITEM_HEIGHT;
        wheelList.style.transition = 'transform 0.2s cubic-bezier(0.1, 0.87, 0.35, 1)';
        wheelList.style.transform = `translateY(${wheelTranslateY}px)`;
        updateVisuals();
    }

    function forceSnapPosition() {
        tempSelectedLevel = calculateLevelFromY(wheelTranslateY);
        wheelTranslateY = -(tempSelectedLevel - 1) * ITEM_HEIGHT;
        wheelList.style.transform = `translateY(${wheelTranslateY}px)`;
        updateVisuals();
    }

    function updateVisuals() {
        let items = wheelList.querySelectorAll('.ios-wheel-item');
        items.forEach(item => {
            let lvl = parseInt(item.dataset.level);
            if (lvl === tempSelectedLevel) {
                item.classList.add('selected');
            } else {
                item.classList.remove('selected');
            }
        });
    }

    wheelContainer.addEventListener('touchstart', (e) => {
        draggingWheel = true; startY = e.touches[0].clientY; wheelList.style.transition = 'none';
    });
    wheelContainer.addEventListener('touchmove', (e) => {
        if (!draggingWheel) return;
        let delta = e.touches[0].clientY - startY; startY = e.touches[0].clientY;
        let minTranslate = -(TOTAL_LEVELS - 1) * ITEM_HEIGHT;
        let maxTranslate = 0;
        wheelTranslateY += delta;
        if (wheelTranslateY > maxTranslate + 20) wheelTranslateY = maxTranslate + 20;
        if (wheelTranslateY < minTranslate - 20) wheelTranslateY = minTranslate - 20;
        wheelList.style.transform = `translateY(${wheelTranslateY}px)`;
        tempSelectedLevel = calculateLevelFromY(wheelTranslateY);
        updateVisuals();
    });
    wheelContainer.addEventListener('touchend', () => {
        draggingWheel = false; wheelList.style.transition = 'transform 0.2s cubic-bezier(0.1, 0.87, 0.35, 1)';
        forceSnapPosition();
    });

    wheelContainer.addEventListener('mousedown', (e) => {
        draggingWheel = true; startY = e.clientY; wheelList.style.transition = 'none';
    });
    window.addEventListener('mousemove', (e) => {
        if (!draggingWheel) return;
        let delta = e.clientY - startY; startY = e.clientY;
        let minTranslate = -(TOTAL_LEVELS - 1) * ITEM_HEIGHT;
        let maxTranslate = 0;
        wheelTranslateY += delta;
        if (wheelTranslateY > maxTranslate + 20) wheelTranslateY = maxTranslate + 20;
        if (wheelTranslateY < minTranslate - 20) wheelTranslateY = minTranslate - 20;
        wheelList.style.transform = `translateY(${wheelTranslateY}px)`;
        tempSelectedLevel = calculateLevelFromY(wheelTranslateY);
        updateVisuals();
    });
    window.addEventListener('mouseup', () => {
        if (draggingWheel) {
            draggingWheel = false; wheelList.style.transition = 'transform 0.2s cubic-bezier(0.1, 0.87, 0.35, 1)';
            forceSnapPosition();
        }
    });

    function openIosPicker() {
        scrollToLevel(currentSelectedLevel);
        iosPickerOverlay.style.display = 'flex';
    }
    function closeIosPicker() { iosPickerOverlay.style.display = 'none'; }
    function confirmIosPicker() {
        currentSelectedLevel = tempSelectedLevel;
        selectLevelBtn.innerText = `Fase: ${currentSelectedLevel}`;
        closeIosPicker();
    }

    const LEVEL_BACKGROUNDS = [
        { bg: '#030825', stroke: '#1a3299', hexFill: '#081763' },
        { bg: '#180325', stroke: '#6d1a99', hexFill: '#400863' },
        { bg: '#03250d', stroke: '#1a993e', hexFill: '#086321' },
        { bg: '#250303', stroke: '#991a1a', hexFill: '#630808' },
        { bg: '#251703', stroke: '#995f1a', hexFill: '#633c08' },
        { bg: '#032125', stroke: '#1a8a99', hexFill: '#085763' },
        { bg: '#25031b', stroke: '#991a78', hexFill: '#63084d' },
        { bg: '#132503', stroke: '#50991a', hexFill: '#316308' },
        { bg: '#1a030c', stroke: '#821a40', hexFill: '#520826' },
        { bg: '#252003', stroke: '#99831a', hexFill: '#635508' },
        { bg: '#021825', stroke: '#1a6f99', hexFill: '#084363' },
        { bg: '#25021f', stroke: '#991a82', hexFill: '#630855' },
        { bg: '#02251c', stroke: '#1a9978', hexFill: '#08634f' },
        { bg: '#250a02', stroke: '#99341a', hexFill: '#631f08' },
        { bg: '#170225', stroke: '#5c1a99', hexFill: '#3b0863' },
        { bg: '#252302', stroke: '#99921a', hexFill: '#635e08' },
        { bg: '#022502', stroke: '#1a991a', hexFill: '#086308' },
        { bg: '#021f25', stroke: '#1a8299', hexFill: '#085463' },
        { bg: '#250212', stroke: '#991a54', hexFill: '#630835' },
        { bg: '#251d02', stroke: '#997a1a', hexFill: '#634f08' }
    ];

    let hexPattern = null;

    function generateLevelPattern(level, customColors = null) {
        let colors = customColors || LEVEL_BACKGROUNDS[(level - 1) % LEVEL_BACKGROUNDS.length];
        let patternCanvas = document.createElement('canvas');
        let pCtx = patternCanvas.getContext('2d');
        patternCanvas.width = 16;
        patternCanvas.height = 28;

        pCtx.fillStyle = colors.bg;
        pCtx.fillRect(0, 0, 16, 28);
        pCtx.strokeStyle = colors.stroke;
        pCtx.lineWidth = 1;
        pCtx.fillStyle = colors.hexFill;

        for (let y = -7; y < 35; y += 14) {
            for (let x = -8; x < 24; x += 16) {
                let offX = (Math.floor(y / 14) % 2 === 0) ? 0 : 8;
                pCtx.beginPath();
                for (let i = 0; i < 6; i++) {
                    let angle = (Math.PI / 3) * i;
                    let hx = (x + offX) + 6 * Math.cos(angle);
                    let hy = y + 6 * Math.sin(angle);
                    if (i === 0) pCtx.moveTo(hx, hy);
                    else pCtx.lineTo(hx, hy);
                }
                pCtx.closePath();
                pCtx.fill();
                pCtx.stroke();
            }
        }
        hexPattern = ctx.createPattern(patternCanvas, 'repeat');
    }

    function drawRoundedRect(x, y, w, h, radius) {
        ctx.beginPath();
        if (ctx.roundRect) {
            ctx.roundRect(x, y, w, h, radius);
        } else {
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + w, y, x + w, y + h, radius);
            ctx.arcTo(x + w, y + h, x, y + h, radius);
            ctx.arcTo(x, y + h, x, y, radius);
            ctx.arcTo(x, y, x + w, y, radius);
        }
        ctx.fill();
    }

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        try {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            if (type === 'paddle') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            } else if (type === 'brick') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(580, now);
                osc.frequency.exponentialRampToValueAtTime(220, now + 0.06);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
                osc.start(now); osc.stop(now + 0.06);
            } else if (type === 'wall') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'bonus') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.06);
                osc.frequency.setValueAtTime(783.99, now + 0.12);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'lose') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'shield') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'introJingle') {
                let notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'triangle';
                    let t = now + (idx * 0.08);
                    osc.frequency.setValueAtTime(freq, t);
                    gain.gain.setValueAtTime(0.2, t);
                    gain.gain.linearRampToValueAtTime(0.01, t + 0.1);
                    osc.start(t); osc.stop(t + 0.1);
                });
            } else if (type === 'laserZoom') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(1800, now + 0.3);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.6);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            } else if (type === 'whoosh') {
                const bufferSize = audioCtx.sampleRate * 2.5;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(150, now);
                filter.frequency.linearRampToValueAtTime(600, now + 1.2);
                filter.frequency.linearRampToValueAtTime(150, now + 2.5);
                filter.Q.value = 3;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 1.0);
                gain.gain.linearRampToValueAtTime(0.01, now + 2.5);
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start(now); noise.stop(now + 2.5);
            } else if (type === 'firework') {
                const bufferSize = audioCtx.sampleRate * 0.5;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(600, now);
                filter.frequency.linearRampToValueAtTime(40, now + 0.5);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);

                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start(now); noise.stop(now + 0.5);
            }
        } catch(err) {
            console.warn("Audio exception:", err);
        }
    }

        let random = Math.random() * totalWeight;
        for (let type of BRICK_TYPES) {
            if (random < type.weight) return type;
            random -= type.weight;
        }
        return BRICK_TYPES[0];

    function launchBalls() {
        if (autoLaunchTimer) clearTimeout(autoLaunchTimer);
        balls.forEach(ball => {
            if (ball.stuck) {
                ball.stuck = false;
                let randomDir = Math.random() > 0.5 ? 1 : -1;
                ball.dx = randomDir * (2 + Math.random() * 2);
                ball.dy = -3.5;
            }
        });
    }

    function spawnMultiBalls() {
        let newBalls = [];
        balls.forEach(b => {
            for (let i = 0; i < 2; i++) {
                newBalls.push({
                    x: b.x, y: b.y,
                    dx: (Math.random() - 0.5) * 6,
                    dy: -Math.abs(b.dy || 3.5),
                    radius: b.radius || 6, stuck: false
                });
            }
        });
        balls = balls.concat(newBalls);
    }

    function triggerVictoryExplosion() {
        victoryExplosionActive = true;
        gameRunning = false;
        
        balls = [];
        bonuses = [];

        playSound('whoosh');

        let startTime = performance.now();
        let duration = 7000;
        let lastFireworkSpawn = 0;
        let fireworksParticles = [];

        function victoryLoop(timestamp) {
            let elapsed = timestamp - startTime;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let stroboscopicTimer = Math.floor(elapsed / 100);
            let randomBg = {
                bg: `hsl(${(stroboscopicTimer * 30) % 360}, 100%, 12%)`,
                stroke: `hsl(${(stroboscopicTimer * 30) % 360}, 100%, 50%)`,
                hexFill: `hsl(${(stroboscopicTimer * 30) % 360}, 100%, 25%)`
            };
            generateLevelPattern(20, randomBg);
            
            ctx.fillStyle = hexPattern;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#444';
            ctx.fillRect(0, topWallY, canvas.width, 4);

            if (elapsed - lastFireworkSpawn > 500 && elapsed < duration - 1000) {
                playSound('firework');
                lastFireworkSpawn = elapsed;

                let startX = 60 + Math.random() * (canvas.width - 120);
                let startY = 100 + Math.random() * 250;
                let particleCount = 70;
                let hue = Math.floor(Math.random() * 360);

                for (let i = 0; i < particleCount; i++) {
                    let angle = Math.random() * Math.PI * 2;
                    let speed = 1.5 + Math.random() * 4.5;
                    fireworksParticles.push({
                        x: startX,
                        y: startY,
                        dx: Math.cos(angle) * speed,
                        dy: Math.sin(angle) * speed,
                        alpha: 1,
                        decay: 0.012 + Math.random() * 0.015,
                        color: `hsl(${hue + Math.random() * 40}, 100%, 65%)`
                    });
                }
            }

            for (let i = fireworksParticles.length - 1; i >= 0; i--) {
                let p = fireworksParticles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.dy += 0.05; 
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    fireworksParticles.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            let shake = (Math.random() - 0.5) * 4;
            ctx.fillStyle = '#FFFFFF';
            drawRoundedRect(paddle.x + shake, paddle.y, paddle.width, paddle.height, 6);

            if (elapsed < duration) {
                requestAnimationFrame(victoryLoop);
            } else {
                checkHighScore();
                document.getElementById('winScore').innerText = `Pontos Totais: ${score}`;
                winOverlay.style.display = 'flex';
            }
        }

        requestAnimationFrame(victoryLoop);
    }

    canvas.addEventListener('touchmove', (e) => {
        if (victoryExplosionActive || levelIntroActive || warpAnimationActive) return;
        let rect = canvas.getBoundingClientRect();
        let touchX = e.touches[0].clientX - rect.left;
        let scale = canvas.width / rect.width;
        let targetX = (touchX * scale) - (paddle.width / 2);
        
        if (targetX < 0) targetX = 0;
        if (targetX + paddle.width > canvas.width) targetX = canvas.width - paddle.width;

        paddle.x = targetX;
        balls.forEach(b => {
            if (b.stuck) b.x = paddle.x + paddle.width / 2;

    });

    function update() {
        if (!gameRunning || victoryExplosionActive) return;

        if (levelIntroActive) {
            levelIntroTimer--;
            if (levelIntroTimer <= 0) {
                levelIntroActive = false;
            }
            draw();
            if (gameRunning) requestAnimationFrame(update);
            return;
        }

        if (warpAnimationActive) {
            warpLaserTimer--;
            if (warpLaserTimer <= 0) {
                warpAnimationActive = false;
                advanceToNextLevel();
            }
            draw();
            if (gameRunning) requestAnimationFrame(update);
            return;
        }

        if (warpDoorActive && paddle.x + paddle.width >= canvas.width - 6) {
            triggerWarpLaserAnimation();
            draw();
            if (gameRunning) requestAnimationFrame(update);
            return;
        }

        // Bolas
        for (let bIndex = balls.length - 1; bIndex >= 0; bIndex--) {
            let ball = balls[bIndex];
            if (!ball) continue;

            if (ball.stuck) {
                ball.x = paddle.x + paddle.width / 2;
                ball.y = paddle.y - ball.radius - 2;
            } else {
                ball.x += ball.dx;
                ball.y += ball.dy;

                if (Math.abs(ball.dx) < 0.3) {
                    ball.dx = (Math.random() > 0.5 ? 1 : -1) * 2.5;
                }

                if (ball.x + ball.radius > canvas.width) {
                    ball.x = canvas.width - ball.radius;
                    ball.dx *= -1;
                    playSound('wall');
                } else if (ball.x - ball.radius < 0) {
                    ball.x = ball.radius;
                    ball.dx *= -1;
                    playSound('wall');
                }

                if (ball.y - ball.radius < topWallY + 4) {
                    ball.y = topWallY + 4 + ball.radius;
                    ball.dy = Math.abs(ball.dy);
                    playSound('wall');
                }

                if (ball.y + ball.radius > paddle.y && ball.y - ball.radius < paddle.y + paddle.height &&
                    ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                    
                    playSound('paddle');
                    if (paddle.glue) { 
                        ball.stuck = true; ball.dx = 0; ball.dy = 0;
                    } else {
                        ball.dy = -Math.abs(ball.dy);
                        let hitPoint = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                        ball.dx = hitPoint * 4;
                        if (Math.abs(ball.dx) < 0.5) ball.dx = hitPoint < 0 ? -1.5 : 1.5;
                    }
                }

                if (electricShieldActive && ball.y + ball.radius >= shieldY) {
                    ball.dy = -Math.abs(ball.dy);
                    electricShieldActive = false; 
                    playSound('shield');
                }

                if (ball.y + ball.radius > canvas.height) {
                    balls.splice(bIndex, 1);
                    continue;
                }

                bricks.forEach(b => {
                    if (b.status === 1) {
                        if (ball.x + ball.radius > b.x && 
                            ball.x - ball.radius < b.x + brickW && 
                            ball.y + ball.radius > b.y && 
                            ball.y - ball.radius < b.y + brickH) {
                            
                            let overlapLeft = (ball.x + ball.radius) - b.x;
                            let overlapRight = (b.x + brickW) - (ball.x - ball.radius);
                            let overlapTop = (ball.y + ball.radius) - b.y;
                            let overlapBottom = (b.y + brickH) - (ball.y - ball.radius);

                            let minOverlapX = Math.min(overlapLeft, overlapRight);
                            let minOverlapY = Math.min(overlapTop, overlapBottom);

                            if (minOverlapX < minOverlapY) {
                                ball.dx *= -1;
                                if (overlapLeft < overlapRight) ball.x = b.x - ball.radius;
                                else ball.x = b.x + brickW + ball.radius;
                            } else {
                                ball.dy *= -1;
                                if (overlapTop < overlapBottom) ball.y = b.y - ball.radius;
                                else ball.y = b.y + brickH + ball.radius;
                            }

                            playSound('brick');

                            if (!b.indestructible) {
                                b.hits--;

                                if (b.hits <= 0) {
                                    b.status = 0;
                                    score += b.points;
                                    brokenCount++;
                                    updateHUD();

                                    if (b.hasCapsule && !isCapsuleOnScreen && balls.length === 1) {
                                        let capType = getDeterministicCapsule();
                                        bonuses.push({ x: b.x + brickW / 2 - 12, y: b.y, type: capType, speed: 2 });
                                        isCapsuleOnScreen = true;
                                    }
                                } else {
                                    if (b.hits === 3) b.color = '#888888';
                                    if (b.hits === 2) b.color = '#666666';
                                    if (b.hits === 1) b.color = '#444444';
                                }
                            }
                        }
                    }
                });
            }
        }

        if (balls.length === 0) {
            playSound('lose');
            lives--; updateHUD();

            if (lives <= 0) {
                gameRunning = false;
                checkHighScore();
                document.getElementById('gameOverTitle').innerText = "FIM DE JOGO";
                document.getElementById('finalScore').innerText = `Pontos Totais: ${score}`;
                gameOverMenu.style.display = 'flex';
                return;
            } else {
                resetBall();
            }
        }

        let remainingDestructibleBricks = bricks.filter(b => b.status === 1 && !b.indestructible).length;
        if (remainingDestructibleBricks === 0) {
            advanceToNextLevel();
            if (gameRunning && !victoryExplosionActive) {
                requestAnimationFrame(update);
            }
            return;
        }

        // Coleta de Cápsulas (Aplica a regra de Mutabilidade / Nullificação)
        for (let i = bonuses.length - 1; i >= 0; i--) {
            let b = bonuses[i];
            b.y += b.speed;
            
            if (b.y + 24 > paddle.y && b.y < paddle.y + paddle.height &&
                b.x + 24 > paddle.x && b.x < paddle.x + paddle.width) {
                
                playSound('bonus');

                // Anula qualquer Power-up anterior antes de aplicar o novo
                clearActiveBonuses();

                if (b.type === 'C') { 
                    paddle.glue = true;
                } else if (b.type === 'E') { 
                    sizeState = 1; updatePaddleSize();
                } else if (b.type === 'S') { 
                    balls.forEach(ball => { ball.dx *= 0.65; ball.dy *= 0.65; });
                } else if (b.type === 'H') { 
                    electricShieldActive = true;
                } else if (b.type === 'G') { 
                    // Giga Ball: O dobro do tamanho original (raio 12), dura 15 segundos
                    balls.forEach(ball => { ball.radius = 12; });
                    gigaBallTimeout = setTimeout(() => {
                        balls.forEach(ball => { ball.radius = 6; });
                    }, 15000);
                } else if (b.type === 'D') { 
                    spawnMultiBalls();
                } else if (b.type === 'P') { 
                    lives++; updateHUD();
                } else if (b.type === 'B') { 
                    warpDoorActive = true;
                }

                bonuses.splice(i, 1);
                isCapsuleOnScreen = false;
            } else if (b.y > canvas.height) {
                bonuses.splice(i, 1);
                isCapsuleOnScreen = false;
            }
        }

        draw();

        if (gameRunning && !victoryExplosionActive) {
            requestAnimationFrame(update);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = hexPattern;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#444';
        ctx.fillRect(0, topWallY, canvas.width, 4);

        if (electricShieldActive) {
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00FFFF';
            ctx.strokeStyle = '#00FFFF';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, shieldY);
            for (let x = 0; x <= canvas.width; x += 10) {
                let offset = (Math.random() - 0.5) * 4;
                ctx.lineTo(x, shieldY + offset);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        if (warpDoorActive) {
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#00FFFF';
            ctx.strokeStyle = '#00FFFF';
            ctx.lineWidth = 2;
            
            ctx.fillStyle = '#FF8C00';
            drawRoundedRect(canvas.width - 10, paddle.y - 18, 10, 45, 4);

            ctx.beginPath();
            ctx.moveTo(canvas.width - 5, paddle.y - 18);
            for (let py = paddle.y - 18; py <= paddle.y + 27; py += 6) {
                let rx = (canvas.width - 5) + (Math.random() - 0.5) * 6;
                ctx.lineTo(rx, py);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        if (warpAnimationActive) {
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00FFFF';
            ctx.fillStyle = '#FFFFFF';
            let beamWidth = (35 - warpLaserTimer) * 12;
            ctx.fillRect(paddle.x, paddle.y, Math.min(canvas.width - paddle.x, beamWidth), paddle.height);
            ctx.shadowBlur = 0;
        } else {
            ctx.fillStyle = '#ffffff';
            drawRoundedRect(paddle.x, paddle.y, paddle.width, paddle.height, 6);
        }

        // Bolas
        ctx.fillStyle = '#ffffff';
        balls.forEach(ball => {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
        });

        // Bricks
        bricks.forEach(b => { 
            if (b.status === 1) {
                ctx.fillStyle = b.color;
                drawRoundedRect(b.x, b.y, brickW, brickH, 4);
            }
        });

        // Cápsulas
        bonuses.forEach(b => {
            let capColor = '#FFFFFF';
            let textColor = '#000000';

            if (b.type === 'C') { capColor = '#00AA00'; textColor = '#FFFFFF'; }
            else if (b.type === 'E') { capColor = '#FFFFFF'; textColor = '#00AA00'; }
            else if (b.type === 'S') { capColor = '#3498db'; textColor = '#FFFFFF'; }
            else if (b.type === 'H') { capColor = '#008B8B'; textColor = '#FFFFFF'; }
            else if (b.type === 'G') { capColor = '#FF1493'; textColor = '#FFFF00'; }
            else if (b.type === 'D') { capColor = '#00FF00'; textColor = '#FFFFFF'; }
            else if (b.type === 'P') { capColor = '#006400'; textColor = '#FFFFFF'; }
            else if (b.type === 'B') { capColor = '#FF8C00'; textColor = '#FFFFFF'; }

            ctx.fillStyle = capColor;
            drawRoundedRect(b.x, b.y, 24, 24, 6);
            
            ctx.fillStyle = textColor;
            ctx.font = 'bold 16px Arial';
            ctx.fillText(b.type, b.x + 6, b.y + 18);
        });

        // Anúncio de Fase "FASE X"
        if (levelIntroActive) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            ctx.fillRect(0, canvas.height / 2 - 45, canvas.width, 90);

            ctx.font = '900 32px -apple-system, BlinkMacSystemFont, Arial';
            ctx.textAlign = 'center';
            ctx.fillStyle = LEVEL_TEXT_COLORS[(currentLevel - 1) % LEVEL_TEXT_COLORS.length];
            ctx.shadowBlur = 12;
            ctx.shadowColor = ctx.fillStyle;
            ctx.fillText(`FASE ${currentLevel}`, canvas.width / 2, canvas.height / 2 + 10);
            
            ctx.textAlign = 'left';
            ctx.shadowBlur = 0;
        }
    }
</script>

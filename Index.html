<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Breakout Mobile - Modular</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>

<div id="gameContainer">
    <div id="hud">
        <span id="scoreText">Pts: 0</span>
        <span id="levelText">Fase: 1/20</span>
        <span id="highScoreText" class="high-score">Rec: 0</span>
        <span id="livesText">Vidas: 5</span>
        <button id="quitBtn" onclick="openPauseMenu()" title="Opções / Pausa">✕</button>
    </div>

    <!-- Menu Principal -->
    <div id="menu">
        <h1 style="margin-bottom: 5px;">BREAKOUT</h1>
        <p id="menuHighScore" class="high-score" style="margin-bottom: 15px; font-weight: bold;">RECORDE: 0</p>
        <button onclick="startGame('easy')">Fácil</button>
        <button onclick="startGame('medium')">Médio</button>
        <button onclick="startGame('hard')">Difícil</button>
        <button id="selectLevelBtn" class="btn-select" onclick="openIosPicker()">Fase: 1</button>
    </div>

    <!-- Menu de Pausa / Desistência -->
    <div id="pauseMenu" style="display: none;">
        <h2 style="margin-bottom: 20px; font-size: 1.8rem;">JOGO PAUSADO</h2>
        <button class="btn-continue" onclick="resumeGame()">Continuar</button>
        <button class="btn-restart" onclick="restartFromLevel1()">Reiniciar Jogo (Fase 1)</button>
        <button class="btn-quit" onclick="quitToMainMenu()">Menu Principal</button>
    </div>

    <!-- Modal iOS Picker Alinhado -->
    <div id="iosPickerOverlay">
        <div class="ios-picker-sheet">
            <div class="ios-picker-header">
                <button class="ios-btn-cancel" onclick="closeIosPicker()">Cancelar</button>
                <span>Selecionar Fase</span>
                <button class="ios-btn-select" onclick="confirmIosPicker()">Selecionar</button>
            </div>
            <div class="ios-wheel-container" id="wheelContainer">
                <div class="ios-wheel-highlight"></div>
                <ul class="ios-wheel-list" id="wheelList"></ul>
            </div>
        </div>
    </div>

    <div id="gameOverMenu" style="display: none;">
        <h1 id="gameOverTitle">FIM DE JOGO</h1>
        <p id="finalScore">Pontos Totais: 0</p>
        <p id="newRecordNotice" class="high-score" style="display: none; font-weight: bold;">NOVO RECORDE!</p>
        <button class="btn-continue" onclick="continueGame()">Continuar (Fase Atual)</button>
        <button onclick="quitToMainMenu()">Menu Principal</button>
    </div>

    <div id="winOverlay">
        <div class="zoom-text">SENSACIONAL!<br>VOCÊ VENCEU TODOS OS DESAFIOS!</div>
        <p id="winScore" style="color: white; margin-top: 30px; font-size: 1.2rem;">Pontos: 0</p>
        <button onclick="quitToMainMenu()" style="margin-top: 20px;">Menu Principal</button>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<!-- Script Principal Modular -->
<script type="module" src="src/js/main.js"></script>

</body>
</html>
